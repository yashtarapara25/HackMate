<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Admin Portal Login — HackMate AI">
  <title>Admin Portal Login — HackMate AI</title>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .admin-auth-body {
      background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.15) 0%, #060608 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .admin-auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-lg);
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.2);
    }

    .admin-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 1.5rem;
      margin-bottom: var(--space-3);
    }
  </style>
</head>
<body class="admin-auth-body">

  <div class="admin-auth-card">
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <div class="admin-logo"><i data-lucide="shield"></i></div>
      <h2 style="color: #ffffff;">Admin Security Portal</h2>
      <p style="margin-top: var(--space-1); color: var(--text-muted); font-size: var(--font-size-sm);">Enter coordinator credentials to access administrator console</p>
    </div>

    <div id="error-message" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: var(--space-3); border-radius: var(--radius-xs); font-size: var(--font-size-xs); margin-bottom: var(--space-4); text-align: center;"></div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event);">
      <div class="form-group">
        <label for="admin-email">Admin Email (Gmail)</label>
        <input type="email" id="admin-email" class="input-control" placeholder="admin@hackmate.ai" value="admin@hackmate.ai" required>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-6);">
        <label for="admin-password">Admin Password</label>
        <input type="password" id="admin-password" class="input-control" placeholder="••••••••" value="AdminPassword123!" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; background: #10b981; border-color: #059669;">
        Authenticate Admin Access <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
      </button>
    </form>
  </div>

  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      const errorDiv = document.getElementById('error-message');
      errorDiv.style.display = 'none';

      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const API_BASE = (localStorage.getItem('HACKMATE_API_URL') || (isLocal ? 'http://localhost:8000' : 'https://hackmate-backend.onrender.com')).replace(/\/$/, '');

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
          localStorage.setItem('HACKMATE_AUTH_TOKEN', data.access_token);
          localStorage.setItem('HACKMATE_ADMIN_USER', JSON.stringify(data.user));
          window.location.href = 'admin.html';
        } else {
          const errData = await response.json();
          errorDiv.innerText = errData.detail || 'Invalid admin credentials.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        // Fallback for offline demo
        if (email.toLowerCase().includes('admin') || email === 'admin@hackmate.ai') {
          localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
          window.location.href = 'admin.html';
        } else {
          errorDiv.innerText = 'Unable to reach backend server. Please check backend connection.';
          errorDiv.style.display = 'block';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
