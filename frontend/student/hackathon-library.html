<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathon Library — HackMate AI</title>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/sidebar.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Styling for archived project cards */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-6);
      margin-top: var(--space-4);
    }

    .project-archived-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
    }

    @media (max-width: 768px) {
      .library-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Universal Header -->
      <header class="top-header" id="top-header"></header>

      <!-- Page Header -->
      <div class="dashboard-header-bar">
        <div>
          <h1>Hackathon Library</h1>
          <p>Browse past submissions and publish new achievements to the repository</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('add-project-modal')"><i data-lucide="plus"></i> Publish Project</button>
      </div>

      <!-- Search & Filters -->
      <div style="display:flex; gap:var(--space-4); margin-bottom:var(--space-6); align-items:center; flex-wrap:wrap;">
        <div class="search-container" style="width:300px; display:block;">
          <i data-lucide="search" class="search-icon" style="width: 16px; height: 16px;"></i>
          <input type="text" class="search-input" id="library-search" placeholder="Search projects by tech, award, title..." style="width:100%;">
        </div>
        <select id="award-filter" class="input-control" style="width:180px; padding:var(--space-2) var(--space-3); font-size:var(--font-size-sm);">
          <option value="all">All Submissions</option>
          <option value="winner">Winner / Awarded</option>
        </select>
      </div>

      <!-- Library Grid -->
      <div class="library-grid" id="library-grid">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Add Project Modal -->
  <div class="modal-overlay" id="add-project-modal">
    <div class="modal-container" style="max-width:600px;">
      <div class="modal-header">
        <h3>Publish Completed Project</h3>
        <button class="btn-icon btn-sm" onclick="closeModal('add-project-modal')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <form id="add-project-form" style="display:grid; grid-template-columns: 1fr 1fr; gap:var(--space-4);">
          <div class="form-group">
            <label for="proj-title">Project Title</label>
            <input type="text" id="proj-title" class="input-control" placeholder="e.g. EcoPulse" required>
          </div>
          <div class="form-group">
            <label for="proj-hackathon">Hackathon Event Name</label>
            <input type="text" id="proj-hackathon" class="input-control" placeholder="e.g. EcoHacks 2025" required>
          </div>
          <div class="form-group">
            <label for="proj-award">Award Received</label>
            <input type="text" id="proj-award" class="input-control" placeholder="e.g. 1st Place Winner" required>
          </div>
          <div class="form-group">
            <label for="proj-tech">Technologies (comma separated)</label>
            <input type="text" id="proj-tech" class="input-control" placeholder="e.g. Node.js, MongoDB" required>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="proj-problem">Problem Statement</label>
            <textarea id="proj-problem" class="input-control" placeholder="What problem did you solve?" style="min-height:50px;" required></textarea>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="proj-solution">Developed Solution</label>
            <textarea id="proj-solution" class="input-control" placeholder="How did your app solve it?" style="min-height:50px;" required></textarea>
          </div>
          <div class="form-group">
            <label for="proj-github">GitHub Repository Link</label>
            <input type="url" id="proj-github" class="input-control" placeholder="https://github.com/..." required>
          </div>
          <div class="form-group">
            <label for="proj-demo">Working Demo Link</label>
            <input type="url" id="proj-demo" class="input-control" placeholder="https://youtube.com/watch?v=..." required>
          </div>
          <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1; margin-top:var(--space-2);"><i data-lucide="plus"></i> Add to Repository</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Common Scripts -->
  <script src="../js/utils/mock-data.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/core/app.js"></script>
  
  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let hackathons = await fetchHackathonsFromBackend();

      renderHackathons(hackathons);

      // Search & filter binders
      const searchBox = Utils.$('#library-search');
      const modeSelect = Utils.$('#award-filter');

      const applyFilters = () => {
        const query = (searchBox?.value || '').toLowerCase().trim();
        const modeVal = modeSelect?.value || 'all';

        const filtered = hackathons.filter(h => {
          const matchQuery = 
            (h.title || '').toLowerCase().includes(query) || 
            (h.description || '').toLowerCase().includes(query) || 
            (h.organizer || '').toLowerCase().includes(query) || 
            (h.location || '').toLowerCase().includes(query);

          const matchMode = modeVal === 'all' || (h.mode || '').toLowerCase() === modeVal.toLowerCase();

          return matchQuery && matchMode;
        });

        renderFilteredHackathons(filtered);
      };

      if (searchBox) searchBox.addEventListener('input', applyFilters);
      if (modeSelect) modeSelect.addEventListener('change', applyFilters);

      // Add Hackathon Form Listener
      const addForm = Utils.$('#add-project-form');
      if (addForm) {
        addForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const title = Utils.$('#proj-title')?.value.trim();
          const organizer = Utils.$('#proj-hackathon')?.value.trim();
          const prize_pool = Utils.$('#proj-award')?.value.trim();
          const mode = Utils.$('#proj-tech')?.value.trim() || 'Online';
          const description = Utils.$('#proj-problem')?.value.trim();
          const website_url = Utils.$('#proj-github')?.value.trim();

          const token = localStorage.getItem('HACKMATE_AUTH_TOKEN');
          const apiBase = Utils.State.getApiBaseUrl();

          try {
            const res = await fetch(`${apiBase}/api/hackathons`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({
                title,
                organizer,
                description,
                prize_pool,
                mode,
                website_url,
                start_date: new Date().toISOString(),
                end_date: new Date(Date.now() + 7 * 24 * 3600 * 1000).toISOString()
              })
            });

            if (res.ok) {
              const newH = await res.json();
              showToast(`Hackathon "${newH.title}" added to database!`, 'success');
              addForm.reset();
              closeModal('add-project-modal');
              hackathons = await fetchHackathonsFromBackend();
              renderHackathons(hackathons);
            } else {
              const err = await res.json();
              showToast(err.detail || "Failed to add hackathon", "danger");
            }
          } catch (err) {
            showToast("Error connecting to server", "danger");
          }
        });
      }
    });

    async function fetchHackathonsFromBackend() {
      const token = localStorage.getItem('HACKMATE_AUTH_TOKEN');
      const apiBase = Utils.State.getApiBaseUrl();

      try {
        const res = await fetch(`${apiBase}/api/hackathons`, {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (res.ok) {
          const list = await res.json();
          return Array.isArray(list) ? list : [];
        }
      } catch (e) {
        console.warn("Could not fetch hackathons from backend:", e);
      }
      return [];
    }

    function renderHackathons(list) {
      renderFilteredHackathons(list);
    }

    function renderFilteredHackathons(projects) {
      const container = Utils.$('#library-grid');
      if (!container) return;

      if (!Array.isArray(projects) || projects.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1; text-align:center; padding:40px 20px;">
            <i data-lucide="archive" class="empty-state-icon" style="width:36px; height:36px; color:var(--text-muted); margin-bottom:12px;"></i>
            <h4 class="empty-state-title" style="color:var(--text-primary); margin-bottom:4px;">No Active Hackathons Found</h4>
            <p class="empty-state-desc" style="color:var(--text-muted); font-size:13px;">Add a new hackathon opportunity or adjust your search filters.</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = projects.map(h => `
        <div class="card project-archived-card" style="background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:var(--space-4);">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:var(--space-3);">
              <div>
                <h3 style="color:var(--text-primary); font-size:var(--font-size-md); font-weight:700;">${h.title}</h3>
                <span style="font-size:11px; color:var(--text-muted);">${h.organizer || 'Hackathon Organizer'} • ${h.mode || 'Online'}</span>
              </div>
              ${h.prize_pool ? `<span class="badge badge-success" style="font-weight:600;"><i data-lucide="trophy" style="width:10px; margin-right:2px;"></i> ${h.prize_pool}</span>` : ''}
            </div>
            <p style="font-size:var(--font-size-sm); margin-bottom:var(--space-3); color:var(--text-secondary); line-height:1.5;">${h.description || 'No description provided.'}</p>
            ${h.location ? `<p style="font-size:11px; color:var(--text-muted);"><i data-lucide="map-pin" style="width:12px;"></i> ${h.location}</p>` : ''}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-color-light); padding-top:var(--space-3); margin-top:var(--space-3);">
            ${h.website_url ? `
              <a href="${h.website_url}" target="_blank" class="btn btn-primary btn-sm" style="padding:4px 10px; font-size:11px;">
                <i data-lucide="external-link" style="width:12px;"></i> Visit Website
              </a>
            ` : '<span></span>'}
            <span class="badge badge-purple" style="font-size:10px;">Status: ${h.status || 'Active'}</span>
          </div>
        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
