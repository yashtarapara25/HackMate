<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Workspace — HackMate AI</title>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/sidebar.css">
  <link rel="stylesheet" href="../css/pages/workspace.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Universal Header -->
      <header class="top-header" id="top-header"></header>

      <!-- Page Header -->
      <div class="dashboard-header-bar">
        <div>
          <h1>Project Workspace</h1>
          <p>Collaboratively draft system requirements, API specs, database diagrams, and slide copies</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('new-document-modal')"><i data-lucide="plus"></i> New Note</button>
      </div>

      <!-- Split Layout: Folders + Editor -->
      <div class="workspace-split-layout">
        <!-- Folders pane -->
        <div class="card workspace-sidebar-card">
          <h3 style="font-size: var(--font-size-md);">Document Directory</h3>
          <div class="workspace-tree" id="workspace-folders-tree">
            <!-- Dynamic tree populated by workspace.js -->
          </div>
        </div>

        <!-- Editor Pane -->
        <div class="card" style="display: flex; flex-direction: column;">
          <!-- Editor Frame -->
          <div class="editor-container" id="editor-frame" style="display: none;">
            <div class="editor-toolbar">
              <button class="btn btn-secondary btn-sm" onclick="Utils.showToast('Bold formatting applied.', 'info')"><i data-lucide="bold" style="width: 14px;"></i></button>
              <button class="btn btn-secondary btn-sm" onclick="Utils.showToast('Italic formatting applied.', 'info')"><i data-lucide="italic" style="width: 14px;"></i></button>
              <button class="btn btn-secondary btn-sm" onclick="Utils.showToast('Header formatting applied.', 'info')"><i data-lucide="heading-1" style="width: 14px;"></i></button>
              <button class="btn btn-secondary btn-sm" onclick="Utils.showToast('Bullet formatting applied.', 'info')"><i data-lucide="list" style="width: 14px;"></i></button>
              <button class="btn btn-secondary btn-sm" onclick="Utils.showToast('Codeblock formatting applied.', 'info')"><i data-lucide="code" style="width: 14px;"></i></button>
              <div style="margin-left: auto; font-size: 10px; color: var(--text-muted);">
                <i data-lucide="refresh-cw" style="width:10px; display:inline-block; vertical-align:middle; animation: spin 2s linear infinite;"></i> Auto-saved locally
              </div>
            </div>
            <input type="text" class="editor-title-input" id="active-doc-title" placeholder="Document Title...">
            <textarea class="editor-textarea" id="active-doc-content" placeholder="Start typing details... (Markdown is supported)"></textarea>
          </div>

          <!-- Empty State (when no file selected) -->
          <div class="empty-state" id="editor-placeholder" style="height: 100%; display: flex;">
            <i data-lucide="file" class="empty-state-icon"></i>
            <h4 class="empty-state-title">No Document Selected</h4>
            <p class="empty-state-desc">Select an active spec or meeting note from the left folder tree to inspect details, or create a new note.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- --- MODALS --- -->
  
  <!-- New Document Modal -->
  <div class="modal-overlay" id="new-document-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Create New Note</h3>
        <button class="btn-icon btn-sm" onclick="closeModal('new-document-modal')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="note-title-input">Note Title</label>
          <input type="text" id="note-title-input" class="input-control" placeholder="e.g. System Design Architecture">
        </div>
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label for="folder-select">Select Folder Destination</label>
          <select id="folder-select" class="input-control">
            <!-- Dynamic options -->
          </select>
        </div>
        <div class="form-group">
          <label for="new-folder-input">Or Create a New Folder</label>
          <input type="text" id="new-folder-input" class="input-control" placeholder="e.g. Project Information">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('new-document-modal')">Cancel</button>
        <button type="button" class="btn btn-primary" id="new-document-trigger" onclick="closeModal('new-document-modal')">Create Document</button>
      </div>
    </div>
  </div>

  <!-- Common Scripts -->
  <script src="../js/utils/mock-data.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/core/app.js"></script>
  <!-- Page Specific Script -->
  <script src="../js/pages/workspace.js"></script>
</body>
</html>
