<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board — HackMate AI</title>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/sidebar.css">
  <link rel="stylesheet" href="../css/pages/taskboard.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Universal Header -->
      <header class="top-header" id="top-header"></header>

      <!-- Page Header -->
      <div class="dashboard-header-bar">
        <div>
          <h1>Task Board</h1>
          <p>Organize, schedule, and assign tickets directly aligning with your design milestones</p>
        </div>
        <button class="btn btn-primary" id="add-ticket-btn" onclick="openModal('create-task-modal')"><i data-lucide="plus"></i> Add Ticket</button>
      </div>

      <!-- Member Simulation Selector -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); background: var(--bg-surface); padding: var(--space-3) var(--space-4); border: 1px solid var(--border-color-light); border-radius: var(--radius-md); flex-wrap: wrap; gap: var(--space-3);">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Simulate Member View:</span>
          <select id="simulate-member-select" class="input-control" style="width: 200px; font-size: 12px; padding: 4px 8px; height: auto; background: var(--bg-canvas); border: 1px solid var(--border-color);">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div id="simulate-member-badge" style="font-size: 11px; font-weight: 600;">
          <!-- Description badge -->
        </div>
      </div>

      <!-- Kanban Board -->
      <div class="kanban-board">
        <!-- 1. Todo -->
        <div class="kanban-column">
          <div class="kanban-column-header">
            <span class="kanban-column-title"><i data-lucide="circle" style="color:var(--text-muted); width:14px;"></i> Backlog / Todo</span>
            <span class="kanban-column-count" id="count-todo">0</span>
          </div>
          <div class="kanban-tasks-list" id="list-todo" data-status="todo">
            <!-- Populated dynamically -->
          </div>
        </div>

        <!-- 2. In Progress -->
        <div class="kanban-column">
          <div class="kanban-column-header">
            <span class="kanban-column-title"><i data-lucide="clock" style="color:var(--warning); width:14px;"></i> In Progress</span>
            <span class="kanban-column-count" id="count-in-progress">0</span>
          </div>
          <div class="kanban-tasks-list" id="list-in-progress" data-status="in-progress">
            <!-- Populated dynamically -->
          </div>
        </div>


        <!-- 4. Completed -->
        <div class="kanban-column">
          <div class="kanban-column-header">
            <span class="kanban-column-title"><i data-lucide="check-circle-2" style="color:var(--secondary); width:14px;"></i> Completed</span>
            <span class="kanban-column-count" id="count-completed">0</span>
          </div>
          <div class="kanban-tasks-list" id="list-completed" data-status="completed">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- --- MODALS --- -->

  <!-- 1. Create Task Modal -->
  <div class="modal-overlay" id="create-task-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Create Workspace Ticket</h3>
        <button class="btn-icon btn-sm" onclick="closeModal('create-task-modal')"><i data-lucide="x"></i></button>
      </div>
      <form id="create-task-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="task-title">Ticket Title</label>
            <input type="text" id="task-title" class="input-control" placeholder="Integrate Vector database Router" required>
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" class="input-control" placeholder="Outline detailed checklist..." style="min-height: 80px;" required></textarea>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label for="task-assignee">Assign Member</label>
              <select id="task-assignee" class="input-control">
                <!-- Populated dynamically -->
              </select>
            </div>
            <div class="form-group">
              <label for="task-priority">Priority Level</label>
              <select id="task-priority" class="input-control">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label for="task-deadline">Deadline Date</label>
              <input type="date" id="task-deadline" class="input-control" required>
            </div>
            <div class="form-group">
              <label for="task-labels">Labels (comma-separated)</label>
              <input type="text" id="task-labels" class="input-control" placeholder="JS, AI, Design">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-task-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Inspect Task Details Modal -->
  <div class="modal-overlay" id="task-details-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="detail-task-title">Ticket Details</h3>
        <button class="btn-icon btn-sm" onclick="closeModal('task-details-modal')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: var(--space-2); margin-bottom: var(--space-4);">
          <span class="badge badge-purple" id="detail-task-priority">High</span>
          <span class="badge badge-success" id="detail-task-status">Todo</span>
        </div>
        <p id="detail-task-desc" style="color:var(--text-secondary); margin-bottom:var(--space-4); line-height:1.5;">
          No description.
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4); border-top:1px solid var(--border-color-light); padding-top:var(--space-3);">
          <div>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Assignee</span>
            <div style="display:flex; align-items:center; gap:var(--space-2); margin-top:4px;">
              <div class="user-avatar" id="detail-task-assignee-avatar" style="width:24px; height:24px; font-size:10px;">AR</div>
              <span id="detail-task-assignee-name" style="font-size:var(--font-size-sm); font-weight:500;">Alex Rivers</span>
            </div>
          </div>
          <div>
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Deadline</span>
            <span id="detail-task-deadline" style="font-size:var(--font-size-sm); color:var(--text-primary); font-weight:500; display:block; margin-top:4px;">July 18, 2026</span>
          </div>
        </div>

        <!-- Task Move status select -->
        <div class="form-group" style="border-top:1px solid var(--border-color-light); padding-top:var(--space-3);">
          <label for="detail-move-status">Move Ticket Status</label>
          <select id="detail-move-status" class="input-control">
            <option value="todo">Backlog / Todo</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- Task Reassignment for Testing -->
        <div class="form-group" style="border-top:1px solid var(--border-color-light); padding-top:var(--space-3); margin-top:var(--space-3);">
          <label for="detail-reassign-select">Reassign for Testing / Review</label>
          <div style="display:flex; gap:var(--space-2); margin-top:4px;">
            <select id="detail-reassign-select" class="input-control" style="flex:1; font-size:12px; padding:4px 8px; height:34px; background:var(--bg-surface); border:1px solid var(--border-color); color:var(--text-primary) !important;">
              <!-- Dynamically populated -->
            </select>
            <button type="button" class="btn btn-secondary btn-sm" id="detail-reassign-submit-btn" style="white-space:nowrap; font-size:11px; padding:4px 10px; background:rgba(16, 185, 129, 0.1); border:1px solid rgba(16, 185, 129, 0.3); color:var(--secondary); cursor:pointer;">
              <i data-lucide="repeat" style="width:12px; height:12px; display:inline-block; vertical-align:middle; margin-right:2px;"></i> Reassign & Test
            </button>
          </div>
        </div>

        <!-- Comments -->
        <div style="border-top:1px solid var(--border-color-light); padding-top:var(--space-3);">
          <span style="font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Ticket Comments</span>
          <div class="ballot-comments-list" id="detail-task-comments" style="margin-bottom:var(--space-3); max-height:100px;">
            <!-- Comments list -->
          </div>
          <form id="detail-comment-form">
            <div style="display:flex; gap: var(--space-2);">
              <input type="text" id="detail-comment-input" class="input-control" placeholder="Write comment..." style="flex:1; padding:var(--space-2); font-size:var(--font-size-xs);" required>
              <button type="submit" class="btn btn-primary btn-sm"><i data-lucide="message-square" style="width:12px;"></i> Add</button>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger btn-sm" id="detail-delete-task-btn"><i data-lucide="trash-2"></i> Delete Ticket</button>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('task-details-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Common Scripts -->
  <script src="../js/utils/mock-data.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/core/app.js"></script>
  <!-- Page Specific Script -->
  <script src="../js/pages/taskboard.js"></script>
</body>
</html>
