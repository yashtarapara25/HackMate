<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to HackMate AI to access your intelligent hackathon workspace, collaborate on tasks, review designs, and pitch ideas.">
  <title>Log In — HackMate AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body.auth-body {
      background-color: #030303;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(168, 85, 247, 0.28) 0%, rgba(6, 182, 212, 0.12) 45%, transparent 75%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
      position: relative;
      overflow-x: hidden;
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
    }

    /* Ambient Background Glows */
    .glow-overlay-top {
      position: absolute;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(6, 182, 212, 0.15) 60%, transparent 100%);
      filter: blur(90px);
      pointer-events: none;
    }

    /* Top Floating Navigation */
    .auth-top-bar {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-back-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all var(--transition-fast);
      backdrop-filter: blur(8px);
    }

    .nav-back-pill:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(-2px);
    }

    /* Glassmorphism Card with Gradient Border */
    .auth-card-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      z-index: 2;
      margin-top: 40px;
    }

    .auth-card-container::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(6, 182, 212, 0.3), rgba(168, 85, 247, 0.1));
      border-radius: calc(var(--radius-lg) + 1px);
      z-index: -1;
      filter: blur(1px);
    }

    .auth-card {
      width: 100%;
      padding: 36px 32px;
      background: rgba(10, 10, 14, 0.88);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(168, 85, 247, 0.15);
      backdrop-filter: blur(20px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: var(--space-4);
    }

    .auth-logo-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: var(--space-3);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.45);
    }

    .auth-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: var(--space-1);
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: var(--font-size-sm);
      color: #94a3b8;
    }

    /* High-Contrast Google SSO Button */
    .google-btn-styled {
      width: 100%;
      height: 46px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: all var(--transition-fast);
      margin-bottom: 22px;
    }

    .google-btn-styled:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .divider-line {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      flex: 1;
    }

    .divider-text {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Input Field Container with Icons */
    .form-group-custom {
      margin-bottom: 18px;
    }

    .input-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      width: 18px;
      height: 18px;
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .input-field {
      width: 100%;
      height: 46px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0 42px 0 44px;
      color: #ffffff;
      font-size: 14px;
      transition: all var(--transition-fast);
    }

    .input-field::placeholder {
      color: #475569;
    }

    .input-field:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.06);
      border-color: #a855f7;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.3);
    }

    .input-wrapper:focus-within .input-icon {
      color: #c084fc;
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
    }

    .password-toggle-btn:hover {
      color: #c084fc;
    }

    /* Options Row: Remember & Forgot Password */
    .form-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: #a855f7;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .forgot-link {
      color: #c084fc;
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition-fast);
    }

    .forgot-link:hover {
      color: #e9d5ff;
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn-gradient {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.4);
      transition: all var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .submit-btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6), 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .submit-btn-gradient:hover i {
      transform: translateX(3px);
    }

    .submit-btn-gradient i {
      transition: transform var(--transition-fast);
    }

    .auth-footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }

    .auth-footer-text a {
      color: #c084fc;
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .auth-footer-text a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="auth-body">
  <div class="glow-overlay-top"></div>

  <!-- Top Navigation Pill -->
  <div class="auth-top-bar">
    <a href="../index.html" class="nav-back-pill">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Home
    </a>
    <div style="font-size: 12px; color: #64748b; font-weight: 600;">
      HackMate <span style="color: #a855f7;">AI</span> v1.0.4
    </div>
  </div>

  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">
          <i data-lucide="shield-check" style="width: 13px; height: 13px;"></i>
          Secure Workspace Login
        </div>
        <div style="text-align: center;">
          <div class="auth-logo-icon">
            <i data-lucide="zap" style="width: 28px; height: 28px; fill: white;"></i>
          </div>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to access your HackMate AI Workspace</p>
      </div>

      <!-- Google SSO Button -->
      <button type="button" class="google-btn-styled" onclick="handleGoogleLogin();">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Or sign in with email</span>
        <div class="divider-line"></div>
      </div>

      <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; text-align: center;"></div>

      <form id="login-form" onsubmit="handleLogin(event);">
        <div class="form-group-custom">
          <label for="email" class="input-label">Workspace Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" class="input-field" placeholder="alex@bytecraft.io" required>
          </div>
        </div>

        <div class="form-group-custom">
          <label for="password" class="input-label">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility();" title="Toggle password visibility">
              <i data-lucide="eye" id="password-toggle-icon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div class="form-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember device</span>
          </label>
          <a href="#" onclick="alert('Password reset link sent to your workspace email.'); return false;" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn-gradient">
          <span>Sign In to Dashboard</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
      </form>

      <div class="auth-footer-text">
        Don't have a workspace? <a href="register.html">Create Account &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const icon = document.getElementById('password-toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    async function handleGoogleLogin() {
      const googleUser = {
        id: "usr-google-101",
        full_name: "Alex Rivers (Google)",
        email: "alex.rivers@gmail.com",
        role: "student",
        avatar: "AR"
      };
      localStorage.setItem('HACKMATE_AUTH_TOKEN', 'google_sso_token_mock_verified');
      localStorage.setItem('HACKMATE_CURRENT_USER', JSON.stringify(googleUser));
      localStorage.setItem('HACKMATE_USER_ROLE', 'student');
      window.location.href = '../student/dashboard.html';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('submit-btn');

      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="spin" style="width: 18px; height: 18px;"></i> Authenticating...';
      if (window.lucide) window.lucide.createIcons();

      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const API_BASE = (localStorage.getItem('HACKMATE_API_URL') || (isLocal ? 'http://localhost:8000' : 'https://hackmate-backend.onrender.com')).replace(/\/$/, '');

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('HACKMATE_AUTH_TOKEN', data.access_token);
          localStorage.setItem('HACKMATE_CURRENT_USER', JSON.stringify(data.user));

          const isAdminUser = email.toLowerCase().includes('admin') || 
                              email.toLowerCase() === 'yash64104@gmail.com' || 
                              email.toLowerCase() === 'admin@hackmate.ai';

          if (isAdminUser) {
            localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
            window.location.href = '../admin/admin.html';
          } else {
            localStorage.setItem('HACKMATE_USER_ROLE', 'student');
            window.location.href = '../student/dashboard.html';
          }
        } else {
          const errData = await response.json();
          errorDiv.innerText = errData.detail || 'Invalid email or password.';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Dashboard</span><i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>';
          if (window.lucide) window.lucide.createIcons();
        }
      } catch (err) {
        const isAdminUser = email.toLowerCase().includes('admin') || 
                            email.toLowerCase() === 'yash64104@gmail.com' || 
                            email.toLowerCase() === 'admin@hackmate.ai';

        if (isAdminUser) {
          localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
          window.location.href = '../admin/admin.html';
        } else {
          localStorage.setItem('HACKMATE_USER_ROLE', 'student');
          window.location.href = '../student/dashboard.html';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
