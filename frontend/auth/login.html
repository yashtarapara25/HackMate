<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to HackMate AI to access your intelligent hackathon workspace, collaborate on tasks, review designs, and pitch ideas.">
  <title>Log In — HackMate AI</title>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-body {
      background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.12) 0%, #09090b 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      background: rgba(18, 18, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .auth-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--primary-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 1.5rem;
      margin-bottom: var(--space-3);
    }

    .demo-badge-btn {
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-size-xs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      margin-top: var(--space-4);
      transition: all var(--transition-fast);
    }

    .demo-badge-btn:hover {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">HM</div>
      <h2>Welcome back</h2>
      <p style="margin-top: var(--space-1);">Enter your workspace credentials</p>
    </div>

    <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: var(--space-3); border-radius: var(--radius-xs); font-size: var(--font-size-xs); margin-bottom: var(--space-4); text-align: center;"></div>

    <form id="login-form" onsubmit="handleLogin(event);">
      <div class="form-group">
        <label for="email">Workspace Email</label>
        <input type="email" id="email" class="input-control" placeholder="alex@bytecraft.io" required>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-6);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password">Password</label>
        </div>
        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px;">Log In & Access Dashboard</button>
    </form>

    <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--text-muted);">
      Don't have a team account? <a href="register.html">Sign up</a>
    </div>

    <div style="margin: var(--space-6) 0; display: flex; align-items: center; justify-content: center; gap: var(--space-3);">
      <div style="height: 1px; background: var(--border-color); flex: 1;"></div>
      <span style="font-size: var(--font-size-xs); color: var(--text-muted);">QUICK DEMO ACCESS</span>
      <div style="height: 1px; background: var(--border-color); flex: 1;"></div>
    </div>

    <button class="demo-badge-btn" onclick="localStorage.setItem('HACKMATE_USER_ROLE', 'student'); window.location.href='../student/dashboard.html';">
      <i data-lucide="play-circle" style="width: 16px; height: 16px;"></i>
      Launch with ByteCraft Demo Workspace
    </button>
  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('login-error');
      errorDiv.style.display = 'none';

      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const API_BASE = (localStorage.getItem('HACKMATE_API_URL') || (isLocal ? 'http://localhost:8000' : 'https://hackmate-backend.onrender.com')).replace(/\/$/, '');

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('HACKMATE_AUTH_TOKEN', data.access_token);
          localStorage.setItem('HACKMATE_CURRENT_USER', JSON.stringify(data.user));

          if (email.toLowerCase().includes('admin')) {
            localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
            window.location.href = '../admin/admin.html';
          } else {
            localStorage.setItem('HACKMATE_USER_ROLE', 'student');
            window.location.href = '../student/dashboard.html';
          }
        } else {
          const errData = await response.json();
          errorDiv.innerText = errData.detail || 'Invalid email or password.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        // Fallback for offline demo state
        if (email.toLowerCase().includes('admin')) {
          localStorage.setItem('HACKMATE_USER_ROLE', 'admin');
          window.location.href = '../admin/admin.html';
        } else {
          localStorage.setItem('HACKMATE_USER_ROLE', 'student');
          window.location.href = '../student/dashboard.html';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
