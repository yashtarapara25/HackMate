<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — HackMate AI</title>
  
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/global.css">
  <link rel="stylesheet" href="../css/layout/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: var(--space-6);
      text-align: center;
    }
    
    .error-card {
      max-width: 480px;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
    }
    
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    
    .error-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .error-desc {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-card">
      <div style="background: rgba(139, 92, 246, 0.1); border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; color: var(--primary); margin-bottom: var(--space-2);">
        <i data-lucide="compass" style="width: 32px; height: 32px;"></i>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Lost in Space</h1>
      <p class="error-desc">The workspace page you are searching for does not exist or has been relocated to another workspace directory.</p>
      <a href="../student/dashboard.html" class="btn btn-primary" style="text-decoration: none;">
        <i data-lucide="home"></i> Back to Dashboard
      </a>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
